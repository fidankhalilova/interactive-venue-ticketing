<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticketmaster</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="site-header">
        <h1>Ticketmaster - Get your tickets now!</h1>
        <p>Choose your seats for tonight's performance!</p>
    </header>
    <main class="layout">
        <section class="map-panel" aria-label="Venue Map">
            <div class="map-controls" role="group" aria-label="Map controls">
                <button type="button" id="zoom-in">Zoom in</button>
                <button type="button" id="zoom-out">Zoom out</button>
                <button type="button" id="move-up">Move up</button>
                <button type="button" id="move-down">Move down</button>
                <button type="button" id="move-left">Move left</button>
                <button type="button" id="move-right">Move right</button>
                <button type="button" id="reset-view">Reset view</button>
            </div>

            <div class="map-viewport" id="map-viewport">
                <div class="map" id="venue-map">
                    <div class="stage">Stage</div>
                    <!-- generated by JS -->
                </div>
            </div>

            <ul class="legend" aria-label="Seat Legend">
                <li><span class="swatch swatch-available"></span>Available</li>
                <li><span class="swatch swatch-inspected"></span>Selected</li>
                <li><span class="swatch swatch-cart"></span>In cart</li>
                <li><span class="swatch swatch-unavailable"></span>Unavailable</li>
            </ul>
        </section>
        <aside class="side-panel">
            <section class="side-panel">
                <h2>Seat Details</h2>
                <div id="seat-details">
                    <p class="empty">Select a seat on the map to view details.</p>
                </div>
                <button type="button" id="add-to-cart">Add to cart</button>
            </section>
            <section class="cart">
                <h2>Your cart</h2>
                <ul id="cart-items">
                    <li class="empty">No tickets here.</li>
                </ul>
                <p class="total">Total: <strong id="cart-total">$0</strong></p>
            </section>
        </aside>
    </main>
    <script src="js/venue-data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
